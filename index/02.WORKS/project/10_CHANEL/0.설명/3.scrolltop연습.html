<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title></title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<style>
    * {margin: 0; padding: 0; list-style: none;}
    #wrap>div {width: 100%; height: 1000px; border-top: 10px solid #000; padding-top: 100px; font-size: 50px; box-sizing: border-box; text-align: center;}
    #bt {width: 25px; height: 90px; background-color: #000; position: fixed; top: 0; right: 20px; bottom: 0; border-radius: 50px; margin: auto;}
    #bt li {width: 15px; height: 15px; background: #fff; border-radius: 15px; margin: 5px;}
    #bt li:nth-child(1) {background: yellow;}
</style>
<script>
    /* animate에 scrollTop을 줄 수 있다. 일반적인 scrolltop과는 별도의 명령이며, animate scrollTop을 쓸 때는 대상은 body,html로 정의한다. animate이 움직이는 대상을 기준으로 하기 때문에 body,html이 목표이다. */
    $(document).ready(function () {
    $("#bt li:nth-child(1)").click(function () {
    // $("body,html").animate({scrollTop:"0px"},500);
    $(window).scrollTop(0);
    })
    $("#bt li:nth-child(2)").click(function () {
    // $("body,html").animate({scrollTop:"1000px"},500);
    $(window).scrollTop(1000);
    })    
    $("#bt li:nth-child(3)").click(function () {
    // $("body,html").animate({scrollTop:"2000px"},500);
    $(window).scrollTop(2000);
    })    
    $("#bt li:nth-child(4)").click(function () {
    // $("body,html").animate({scrollTop:"3000px"},500);
    $(window).scrollTop(3000);
    })    
    $("#bt li").click(function () {
    $(this).css({"background-color":"yellow"}).siblings().css({"background-color":"#fff"});
    })
    }) // end
</script>
</head>
<body>
    <div id="wrap">
        <div id="box1">page1</div>
        <div id="box2">page2</div>
        <div id="box3">page3</div>
        <div id="box4">page4</div>
    </div>
    <ul id="bt">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
</body>
</html>
