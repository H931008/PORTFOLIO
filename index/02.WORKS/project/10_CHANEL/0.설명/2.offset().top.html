<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title></title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>    
<style>
    div {width: 200px; height: 200px; background: blue; margin-top: 500px;}
</style>
<script>
    $(document).ready(function () {
    var ab=$("div").offset().top;
    // 변수 ab에 div문서 내 세로 위치한 값을 저장한다.
    alert(ab); // 해당 위치 값을 경고창에 출력한다.
    }) //end
</script>
</head>
<body>
    <div></div>
</body>
</html>
<!--
offset().top은 해당 선택자를 기준으로 문서 끝에서부터 선택자가 위치하고 있는 y축의 거리를 나타낸다.
scrollTop()은 브라우저 자체와 스크롤 된 거리를 거리를 계산해 준다면, offset().top은 브라우저가 아닌 특정 요소의 문서 끝에서 y축의 위치를 계산한다.
-->
