<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title></title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>    
<style>
    * {margin: 0; padding: 0; list-style: none;}
    div {width: 100%; height: 1000px; border-top: 10px solid #000; padding-top: 100px; font-size: 100px; box-sizing: border-box; text-align: center;}
    #bt {width: 25px; height: 130px; background-color: #000; position: fixed; top: 0; right: 20px; bottom: 0; border-radius: 50px; margin: auto;}
    #bt li {width: 15px; height: 15px; background: red; border-radius: 15px; margin: 5px;}
    p {font-size: 50px; position: fixed;}
    h1 {display: none;}
</style>
<script>
    $(document).ready(function () {
    $(window).scroll(function () {
    var sc=$(window).scrollTop();
    $("p").text(sc);
    if(sc>0){
    $("#page1 h1").fadeIn(2000);
    }
    if(sc>1000){
    $("#page2 h1").fadeIn(2000);
    }
    if(sc>2000){
    $("#page3 h1").fadeIn(2000);
    }
    if(sc>3000){
    $("#page4 h1").fadeIn(2000);
    }
    if(sc>4000){
    $("#page5 h1").fadeIn(2000);
    }
    }) //scroll end 
    $("#bt li").click(function () {
    var num=$(this).index(0)*1000;
    $("body,html").animate({scrollTop:num},1000);
    // 
    })    
    }) //end
</script>
</head>
<body>
    <p></p>
    <div id="page1"><h1>page1</h1></div>
    <div id="page2"><h1>page2</h1></div>
    <div id="page3"><h1>page3</h1></div>
    <div id="page4"><h1>page4</h1></div>
    <div id="page5"><h1>page5</h1></div>
    <ul id="bt">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
</body>
</html>
