<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title></title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<script src="jquery.mousewheel.min.js"></script>
<style>
    div{width:600px;height:400px;background:#888;margin:50px auto;}
    div p{font-size:40px;color:#fff;}
</style>
<script>
    $(document).ready(function() {
    $("div").on("mousewheel",function(event,delta){
    if(delta>0){
    $(this).css({"background-color":"red"});
    $("p").text("마우스 휠을 올렸을때 상황")
    }else if(delta<0){
    $(this).css({"background-color":"blue"});
    $("p").text("마우스 휠을 내렸을때 상황")
    }
    })
    })//end    
</script>
</head>
<body>
    <div>
        <p></p>    
    </div>
</body>
</html>
