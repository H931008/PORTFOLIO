<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DROPTOP - JOIN</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .page-header {
            background-color: #f4f4f4;
            padding: 40px 0;
            text-align: center;
            margin-bottom: 40px;
        }
        .page-header h2 {
            font-size: 32px;
            color: #1e2f55;
        }
        .join-form {
            max-width: 600px;
            margin: 0 auto 80px;
            padding: 40px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-join-action {
            width: 100%;
            padding: 15px;
            background-color: #1e2f55;
            color: #fff;
            border: none;
            font-size: 16px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-join-cancel {
            width: 100%;
            padding: 15px;
            background-color: #fff;
            color: #333;
            border: 1px solid #ddd;
            font-size: 16px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- Header Section (Simplified for Join Page, or Full) -->
    <!-- Using Full Header for consistency -->
    <header>
        <div class="top-bar">
            <div class="container">
                <div class="top-left">
                    <button id="btn-find-store" class="icon-btn"><i class="fas fa-map-marker-alt"></i> 매장찾기</button>
                </div>
                <div class="logo">
                     <h1><a href="index.html">DROPTOP</a></h1>
                </div>
                <div class="top-right">
                    <ul class="util-nav">
                        <li><a href="index.html">HOME</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="main-nav-bar">
            <div class="container">
                <nav class="gnb">
                    <ul>
                         <li><a href="#">DROPTOP</a></li>
                         <li><a href="#">메뉴</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="page-header">
        <div class="container">
            <h2>회원가입</h2>
            <p>드롭탑의 다양한 혜택을 누려보세요.</p>
        </div>
    </div>

    <div class="container">
        <form class="join-form" id="joinForm">
            <div class="form-group">
                <label for="uid">아이디</label>
                <input type="text" id="uid" required placeholder="영문, 숫자 포함 6자 이상">
            </div>
            <div class="form-group">
                <label for="upw">비밀번호</label>
                <input type="password" id="upw" required placeholder="비밀번호를 입력해주세요">
            </div>
            <div class="form-group">
                <label for="uname">이름</label>
                <input type="text" id="uname" required placeholder="이름을 입력해주세요">
            </div>
            <div class="form-group">
                <label for="uemail">이메일</label>
                <input type="email" id="uemail" required placeholder="example@droptop.com">
            </div>
            <div class="form-group">
                <label for="uphone">휴대폰 번호</label>
                <input type="tel" id="uphone" required placeholder="010-0000-0000">
            </div>
            <button type="submit" class="btn-join-action">가입하기</button>
            <button type="button" class="btn-join-cancel" onclick="location.href='index.html'">취소</button>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <address>
                <p>Copyright © DROPTOP. All Rights Reserved.</p>
            </address>
        </div>
    </footer>

    <script>
        document.getElementById('joinForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.');
            location.href = 'index.html'; // Or trigger login modal if we could, but index is safe
        });
    </script>
</body>
</html>
